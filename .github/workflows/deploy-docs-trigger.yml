name: Rebuild versioned docs on main

on:
  push:
    branches: [next2]

permissions:
  actions: write
  contents: read

concurrency:
  group: docs-deploy-trigger
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the combined Pages build on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
