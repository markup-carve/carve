name: AST conformance

# `ast:check` is the only thing that measures PART 12 conformance, and until now
# it ran nowhere (carve#475). It needs the satellite checkouts, which is why it
# was never wired into ci.yml - so it lives here instead, on a schedule.
#
# SCHEDULED rather than per-PR on purpose. What this catches is cross-repo
# DRIFT: an engine's main moving away from the published AST while this repo's
# main stands still. That is a daily-cadence problem, and cloning and BUILDING
# three engines on every PR would add minutes to a gate that would almost always
# say the same thing. workflow_dispatch is here for when you want it now.
#
# CARVE_REQUIRE_ALL_ENGINES=1 turns a missing or unbuildable engine into a red
# run. That is the whole point of running it here: the checkouts are provisioned
# deliberately, so one dropping out is a broken job, not a line of prose.

on:
  schedule:
    # 04:00 UTC daily, after the downstream bump workflow has had a night to run.
    # Sunday has its own spelling so the generated differential sweeps below
    # can run weekly while reusing this job's already-built engine checkouts.
    - cron: '0 4 * * 1-6'
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      depth:
        description: Run the daily gates or include the weekly exploratory sweeps
        type: choice
        options: [daily, full]
        default: daily

permissions:
  contents: read
  # The verdict step at the end of the job files what this run found. `issues`
  # to open, update and close the tracking issue; `actions` to read back which
  # of this job's own steps failed, so the report names them rather than
  # sending a reader to hunt through a 40-minute log.
  issues: write
  actions: read

# Scheduled and manual runs use separate groups: a diagnostic dispatch must not
# queue behind the daily run. A newer manual dispatch supersedes an older one;
# scheduled evidence is allowed to finish.
concurrency:
  group: ast-conformance-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  formatter:
    name: formatter (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['0/4', '1/4', '2/4', '3/4']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          repository: markup-carve/carve-js
          path: carve-js
          submodules: recursive
      - name: Build carve-js
        working-directory: carve-js
        run: npm ci && npm run build
      - uses: actions/checkout@v4
        with:
          repository: markup-carve/carve-rs
          path: carve-rs
          submodules: recursive
      - name: Build carve-rs
        working-directory: carve-rs
        run: cargo build --release
      - uses: actions/checkout@v4
        with:
          repository: markup-carve/carve-php
          path: carve-php
          submodules: recursive
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Install carve-php
        working-directory: carve-php
        run: composer install --no-interaction --no-progress
      - name: PART 11 formatter and render conformance
        env:
          CARVE_JS_DIR: ${{ github.workspace }}/carve-js
          CARVE_RS_DIR: ${{ github.workspace }}/carve-rs
          CARVE_PHP_DIR: ${{ github.workspace }}/carve-php
        run: npm run compare:impls -- --roundtrip --fail-on-diff --shard=${{ matrix.shard }} --report=/tmp/compare-impls.json
      - name: Cross-engine render comparison
        if: always()
        run: npm run compare:report -- /tmp/compare-impls.json

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out carve
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Each engine is checked out and BUILT from its own main. A build is not
      # optional here: the checker reads whatever artifact is on disk, and a
      # stale one reports the old behavior under the current name - which is
      # exactly how carve#475's own figures came to be wrong.
      - name: Check out carve-js
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve-js
          path: carve-js
          submodules: recursive

      - name: Build carve-js
        working-directory: carve-js
        run: npm ci && npm run build

      - name: Check out carve-rs
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve-rs
          path: carve-rs
          submodules: recursive

      - name: Build carve-rs
        working-directory: carve-rs
        run: cargo build --release

      - name: Check out carve-php
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve-php
          path: carve-php
          submodules: recursive

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install carve-php
        working-directory: carve-php
        run: composer install --no-interaction --no-progress

      - name: Check out carve-rb
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve-rb
          path: carve-rb

      # `bundler-cache: true` restores carve-rb's gems from the actions cache
      # instead of resolving and building them from scratch, which was 54s of
      # pure setup on every run. It needs `working-directory` because the
      # Gemfile is in the carve-rb checkout, not in this repo.
      #
      # carve-rb commits no Gemfile.lock, so setup-ruby resolves once and keys
      # the cache on the lock it generates. The `bundle install` in the build
      # step below is kept deliberately: it costs about a second against a warm
      # cache and it is what makes a cache miss, or a bundle path this action
      # configures differently than expected, an ordinary slow run rather than a
      # red job.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: carve-rb

      - uses: dtolnay/rust-toolchain@stable

      # rb-sys drives bindgen, which needs libclang. Same step carve-rb's own CI
      # runs; without it `rake compile` fails on a fresh runner.
      - name: Install libclang (rb-sys bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Build carve-rb
        working-directory: carve-rb
        run: |
          bundle install
          bundle exec rake compile

      - name: PART 12 conformance
        env:
          CARVE_JS_DIR: ${{ github.workspace }}/carve-js
          CARVE_RS_DIR: ${{ github.workspace }}/carve-rs
          CARVE_RB_DIR: ${{ github.workspace }}/carve-rb
          CARVE_PHP_DIR: ${{ github.workspace }}/carve-php
          # Every engine is checked out and built above, so a missing one is a
          # broken job rather than a local convenience - which is what this flag
          # is for. Setting it while knowingly not provisioning an engine would
          # make the run permanently red, and a permanently red scheduled job
          # gets muted, which is the failure this whole issue is about.
          CARVE_REQUIRE_ALL_ENGINES: '1'
        # NO --satellite-limit here. The cap exists for a quick local pass;
        # this job provisions every engine precisely so it can measure all of
        # them over everything. It was pinned at 520 when the corpus was that
        # size, and the corpus has grown to 542 (545 samples with the synthetic
        # astral cases), so the last 25 were being skipped - a number that goes
        # further out of date with every fixture added, and the newest fixtures
        # are the ones most likely to catch drift.
        run: npm run ast:check

      # Formatter and render conformance run concurrently in the sharded
      # formatter matrix above; this job retains AST and the short auxiliary gates.

      # The converters run the OTHER direction - foreign source to Carve - and
      # sat outside every gate: carve#1130 lists six converter fixes in one
      # stretch of work that reached one engine and not the others, each found
      # by a different engine's suite or by throwaway scaffolding. The per-PR
      # half (tests/corpus-convert.test.mjs) pins the build this repo pins;
      # THIS is the cross-engine half, which needs the checkouts this job
      # provisions and which found four of the five defects in the ticket's
      # own measurement sweep.
      #
      # Each engine converts every case whose source format it imports, then
      # carve-js renders every produced document, and the render is compared
      # against the case's expected.html. An engine with no importer for a
      # format is a DECLARED skip (scripts/lib/converter-formats.mjs); an
      # engine known to be behind a ruled conversion is DECLARED drift
      # (resources/converter-drift.txt). Both declarations are checked in both
      # directions, so neither can outlive what it describes.
      #
      # `if: always()`, like every gate in this job: a converter divergence
      # must not go unmeasured because an unrelated AST finding failed first.
      - name: Cross-engine converter comparison
        if: always()
        env:
          CARVE_JS_DIR: ${{ github.workspace }}/carve-js
          CARVE_RS_DIR: ${{ github.workspace }}/carve-rs
          CARVE_PHP_DIR: ${{ github.workspace }}/carve-php
        run: npm run compare:convert

      # Tier-2/Tier-3 fixtures need explicit extension adapters, so the default
      # corpus sweep in the formatter job cannot exercise them. Run the small
      # optional corpus against the same already-built engines and fail on a
      # wrong adapter command or a cross-engine output difference.
      - name: Cross-engine optional-corpus comparison
        if: always()
        env:
          CARVE_JS_DIR: ${{ github.workspace }}/carve-js
          CARVE_RS_DIR: ${{ github.workspace }}/carve-rs
          CARVE_PHP_DIR: ${{ github.workspace }}/carve-php
        run: npm run compare:impls -- --corpus=optional --fail-on-diff


      # The grammar names engines and says what they do - "all impls support
      # it", "carve-rs is the reference here", "carve-php additionally accepts
      # colon-bearing keys". Those sentences are how a second implementer learns
      # where the margins are, and nothing checked any of them. Two had already
      # rotted: PART 12 §4's implementation status described an engine that no
      # longer existed, and the math paragraph named a carve-php defect that was
      # fixed. Both were found by reading.
      #
      # GATES, in both directions: a claim of agreement fails if an engine
      # drifts, and a documented divergence fails if it is silently resolved -
      # which is the direction that leaves a false sentence in the spec.
      - name: Grammar cross-engine claims
        if: always()
        env:
          CARVE_JS_DIR: ${{ github.workspace }}/carve-js
          CARVE_RS_DIR: ${{ github.workspace }}/carve-rs
          CARVE_PHP_DIR: ${{ github.workspace }}/carve-php
        run: npm run claims:check

      # docs/graceful-degradation.md tells an author what survives when a
      # document leaves interactive HTML. It is normative and it quantifies over
      # RENDERERS - "the renderer MUST preserve the construct's content and
      # structure" - while tests/degradation-claims.test.mjs enforces it through
      # the single carve-js build package.json pins. So a degradation defect
      # that spares carve-js was invisible (carve#843): carve-php's static-mode
      # spoiler was byte-identical to its interactive output, a `<details>` with
      # no `open`, which a print engine renders shut. Two of three engines were
      # right and the gate checked one of the two.
      #
      # The corpus cannot reach this either - a fixture renders in the default
      # mode with no extensions - so compare:impls is not covering it.
      #
      # Asserts the page's rows as observable PROPERTIES, not bytes: carve-rs
      # has no tabs extension, so it satisfies the tabs row through the core
      # caption floor rather than a tabs-label heading, and both are correct.
      - name: Graceful-degradation claims, in every engine
        if: always()
        env:
          CARVE_JS_DIR: ${{ github.workspace }}/carve-js
          CARVE_RS_DIR: ${{ github.workspace }}/carve-rs
          CARVE_PHP_DIR: ${{ github.workspace }}/carve-php
        run: npm run degradation:check

      # A `tests/corpus/<slug>.fmt` file is PART 11's canonical form for one
      # document - the exact source every conforming writer must produce for it.
      # tests/corpus-fmt-roundtrip.test.mjs reads those fixtures through the
      # single carve-js build package.json pins, so a writer defect that spares
      # carve-js was invisible (carve#841): at carve-php ef28bbf, `fmt` on corpus
      # 228 hoisted a footnote definition out of the list item that held it,
      # while carve-js and carve-rs wrote it back where the author put it.
      #
      # The step above it covers PART 11 §1 - the SEMANTIC invariants, which
      # admit latitude in spelling - for all three engines already. This covers
      # the remaining question a .fmt fixture exists to answer: which of the
      # spellings that satisfy §1 is the canonical one. For that, the bytes are
      # the property, which is why this compares bytes where the degradation
      # checker above deliberately does not.
      - name: Canonical form, in every engine
        if: always()
        env:
          CARVE_JS_DIR: ${{ github.workspace }}/carve-js
          CARVE_RS_DIR: ${{ github.workspace }}/carve-rs
          CARVE_PHP_DIR: ${{ github.workspace }}/carve-php
        run: npm run fmt:check

      # Curated interaction products rather than another corpus walk. The
      # original 120-document heading family reached none of the seams found by
      # the 2026-08-16 differential sweep; the expanded families defend those
      # seams and the two clean control sweeps. Weekly rather than per PR because
      # this needs all three engine mains built. A dispatch runs it too, so a
      # finding can be re-measured immediately.
      - name: Curated combinatorial seam families
        if: github.event.schedule == '0 4 * * 0' || inputs.depth == 'full'
        env:
          CARVE_RS_DIR: ${{ github.workspace }}/carve-rs
          CARVE_PHP_DIR: ${{ github.workspace }}/carve-php
        run: npm run combinatorial:check

      # Deterministic but exploratory: every minimized class becomes a focused
      # issue and corpus candidate. The current marker-line definition finding
      # is tracked as carve#1425. Exit 2 (an engine missing or unable to run)
      # remains a hard failure; exit 1 stays visible without making the whole
      # weekly conformance verdict permanently red while adjudication proceeds.
      - name: Differential fuzz sweep
        if: github.event.schedule == '0 4 * * 0' || inputs.depth == 'full'
        env:
          CARVE_JS_DIR: ${{ github.workspace }}/carve-js
          CARVE_RS_DIR: ${{ github.workspace }}/carve-rs
          CARVE_PHP_DIR: ${{ github.workspace }}/carve-php
        run: |
          set +e
          npm run fuzz:impls -- --seed=101 --count=200 --max-findings=16 2>&1 | tee /tmp/fuzz-impls.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo '## Weekly differential fuzz sweep'
            echo
            echo '```text'
            tail -n 40 /tmp/fuzz-impls.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 2 ]; then
            echo '::error::The differential fuzzer could not run all three engines.'
            exit 2
          fi
          if [ "$status" -eq 1 ]; then
            echo '::warning::The differential fuzzer found tracked or new questions; inspect the job summary and carve#1425.'
          fi

      # The same generated sweep the per-PR job runs, ten times larger.
      #
      # ci.yml runs 2000 documents so a PR is not made to wait; this runs 20000,
      # measured at 6.3s. Same fixed seed, so the per-PR set is a PREFIX of this
      # one: a shape only this job reaches is genuinely a shape the cheaper run
      # cannot see, rather than a different lottery.
      #
      # SINGLE ENGINE, deliberately, even though this job is the one with three
      # built checkouts. The script's --engines mode compares the three writers
      # byte for byte on the same generated documents, and it does not pass:
      # measured with all three built, 23 of 400 generated documents diverge,
      # roughly one in 17 (carve#1028). Wiring it now would mean either a
      # permanently red job,
      # which gets muted, or a step that prints its findings and exits 0, which
      # is the defect this whole change is undoing. It gets wired when its
      # ticket closes.
      - name: PART 11 canonical-writer invariants (generated sweep)
        if: always()
        run: npm run property:check -- --count=20000

      # tests/profile-fixtures.json is the shared profile battery: carve-js and
      # carve-rs assert their profile output against it, and it is GENERATED
      # from carve-php by a command documented in a comment at the top of
      # gen-profile-fixtures.php. Nothing ran that command again.
      #
      # So if carve-php's profile output changed, the file would keep the old
      # answer and the other two engines would go on agreeing with it - three
      # engines in consensus about a reference none of them produces. The
      # battery is the only cross-engine check of what a profile PERMITS, which
      # is a security surface: `comment` and `minimal` exist to strip things.
      - name: Profile battery is still what carve-php produces
        if: always()
        env:
          CARVE_PHP_AUTOLOAD: ${{ github.workspace }}/carve-php/vendor/autoload.php
        run: |
          php tests/gen-profile-fixtures.php > /tmp/profile-fixtures.regenerated.json
          diff -u tests/profile-fixtures.json /tmp/profile-fixtures.regenerated.json \
            || { echo "::error::tests/profile-fixtures.json no longer matches carve-php. Regenerate it (see the header of tests/gen-profile-fixtures.php) and re-check carve-js and carve-rs against the new file."; exit 1; }

      # THE READER. Everything above reports into a job nobody is obliged to
      # open. This workflow runs on a SCHEDULE, so no pull request gate can see
      # it go red, `main` shows green push CI while it is failing, and for weeks
      # nothing looked (carve#961). That is the check-with-no-reader family
      # catalogued in carve#755: the check exists, runs, and reports, and no one
      # consumes the result. A second check reporting into the same void would
      # be the defect rather than the fix, so what this step adds is a CONSUMER.
      #
      # The run files its own verdict where this project's backlog already
      # looks: one tracking issue, opened by the first red run, kept current by
      # every later one, and CLOSED by the first green run. An open issue is
      # what the org-wide sweep enumerates and what a human sees on the issue
      # list, so a red schedule now costs someone a ticket instead of nothing.
      #
      # Closing it by hand does not mute it. The lookup below matches OPEN
      # issues only, so the next red run opens a fresh one; the only way to stop
      # the reports is to make the run green. Nor does it accumulate: a red run
      # with an open ticket edits that ticket rather than filing another.
      #
      # It carries no label on purpose - `hold` and `needs-decision` are the two
      # labels this org's automation reads as "do not touch", and an alert that
      # lands pre-silenced is no alert.
      #
      # TICKETS BELONG TO THE DEFAULT BRANCH ONLY. `workflow_dispatch` can be
      # aimed at any branch, but a ticket scoped to a branch that is later
      # deleted can never receive the green run that would close it. Branch
      # runs still have their Actions verdict; only the durable backlog alert
      # is restricted to the durable ref (carve#1656).
      #
      # This step FAILS if it cannot file. A reporter that swallows its own
      # errors is exactly the defect it exists to fix, so a missing permission
      # or a rate limit turns the job red rather than passing quietly.
      - name: File the verdict where someone reads it
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "AST conformance verdict tickets are scoped to $DEFAULT_BRANCH; $REF_NAME keeps its Actions verdict only."
            echo "AST conformance on \`$REF_NAME\` is reported by this run; backlog tickets are scoped to \`$DEFAULT_BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          TITLE="AST conformance is failing on $REF_NAME"
          MARKER="<!-- ast-conformance-verdict ref=$REF_NAME -->"
          GATES_MARKER="<!-- ast-conformance-gates"

          # Formatter shards run beside this job. Wait for them before reading
          # the run so one verdict covers every independent gate.
          for attempt in $(seq 1 80); do
            pending="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
              --jq '[.jobs[] | select(.name != "conformance" and .status != "completed")] | length')"
            [ "$pending" -eq 0 ] && break
            sleep 15
          done

          # Which steps failed, read back from the run itself. A hand-kept list
          # of step ids would go stale the first time a step is added, and a
          # step this report forgot to name is a step whose failure is invisible
          # again.
          failed="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[].steps[] | select(.conclusion == "failure") | "- `" + .name + "`"')"
          bad_jobs="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "skipped") | "- `" + .name + "` (" + .conclusion + ")"')"
          failed="${failed}${failed:+$'\n'}${bad_jobs}"

          # Discover the gate set from the run instead of keeping a second list
          # beside the workflow. A Sunday/full run executes gates a daily run
          # skips, and a daily green must not close a ticket one of those gates
          # opened. Red runs retain their union, so evidence can widen the
          # requirement but cannot silently narrow it (carve#1656).
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[].steps[] | select(.name != "File the verdict where someone reads it") | select(.conclusion == "success" or .conclusion == "failure") | .name' \
            | sort -u > /tmp/ast-conformance-current-gates.txt

          # Matched on the marker in the body rather than on the title, so
          # renaming the issue does not fork it into two, and listed rather than
          # searched, because the search index lags behind a fresh issue by
          # enough to file a duplicate.
          open_issues="$(gh api "repos/$REPO/issues?state=open&per_page=100" --paginate \
            | jq -r --arg m "$MARKER" \
                '.[] | select(.pull_request == null) | select((.body // "") | contains($m)) | .number')"
          issue="${open_issues%%$'\n'*}"

          if [ -n "$issue" ]; then
            gh issue view "$issue" --repo "$REPO" --json body --jq .body \
              | sed -n '/^<!-- ast-conformance-gates$/,/^-->$/p' \
              | sed '1d;$d' > /tmp/ast-conformance-previous-gates.txt
          else
            : > /tmp/ast-conformance-previous-gates.txt
          fi
          sort -u /tmp/ast-conformance-current-gates.txt \
            /tmp/ast-conformance-previous-gates.txt \
            > /tmp/ast-conformance-required-gates.txt

          if [ -z "$failed" ] && [ "$pending" -eq 0 ]; then
            echo "AST conformance is green on $HEAD_SHA."
            if [ -n "$issue" ]; then
              missing="$(comm -23 /tmp/ast-conformance-required-gates.txt /tmp/ast-conformance-current-gates.txt)"
              if [ -n "$missing" ]; then
                missing_list="$(printf '%s\n' "$missing" | sed 's/^/- `/; s/$/`/')"
                gh issue comment "$issue" --repo "$REPO" --body \
                  $'This run is green for the gates it executed, but it did not close the ticket because it skipped gates measured by an earlier red run:\n\n'"$missing_list"$'\n\nA green full-depth run that executes them can close it.'
                {
                  echo "AST conformance is green on \`$HEAD_SHA\` for the gates this run executed, but #$issue remains open because this run skipped:"
                  echo
                  printf '%s\n' "$missing_list"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              gh issue comment "$issue" --repo "$REPO" --body \
                "Green again: run $RUN_URL on \`$HEAD_SHA\`. Closing. The next red run opens a fresh ticket rather than reopening this one, so a closed ticket always means the last run passed."
              gh issue close "$issue" --repo "$REPO"
              echo "Closed #$issue."
            fi
            echo "AST conformance green on \`$HEAD_SHA\`. Nothing filed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "$MARKER"
            echo "$GATES_MARKER"
            cat /tmp/ast-conformance-required-gates.txt
            echo "-->"
            echo
            echo "\`AST conformance\` is failing on \`$REF_NAME\`. This workflow builds four"
            echo "engines and runs on a daily schedule, so no pull request gate sees it and"
            echo "the branch shows green push CI while this is red."
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| run | $RUN_URL |"
            echo "| commit | \`$HEAD_SHA\` |"
            echo "| ref | \`$REF_NAME\` |"
            echo "| trigger | \`$EVENT_NAME\` |"
            echo
            echo "### Failing steps"
            echo
            if [ -n "$failed" ]; then
              printf '%s\n' "$failed"
            else
              echo "- (none reported; the job did not complete - see the run)"
            fi
            echo
            echo "### Before acting on this"
            echo
            echo "The counts in the run are a snapshot. Four engines merge into their own"
            echo "\`main\` through the day and this workflow runs once at 04:00 UTC, so a"
            echo "figure read here can be hours and a dozen merges old. Re-dispatch"
            echo "(\`gh workflow run ast-conformance.yml -R $REPO\`) and quote the run id you"
            echo "measured, rather than rerunning this one - a rerun overwrites the evidence."
            echo
            echo "This ticket is filed and maintained by the workflow. It is EDITED by each"
            echo "later red run and CLOSED by the first green one. Closing it by hand does"
            echo "not silence it: the next red run files a new one."
          } > /tmp/ast-conformance-verdict.md

          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$REPO" --body-file /tmp/ast-conformance-verdict.md
            echo "Updated #$issue."
            url="$(gh issue view "$issue" --repo "$REPO" --json url --jq .url)"
          else
            url="$(gh issue create --repo "$REPO" --title "$TITLE" \
              --body-file /tmp/ast-conformance-verdict.md)"
            echo "Filed $url."
          fi

          {
            echo "## AST conformance is red"
            echo
            echo "Filed at $url"
            echo
            printf '%s\n' "${failed:-- (no step reported a failure)}"
          } >> "$GITHUB_STEP_SUMMARY"
