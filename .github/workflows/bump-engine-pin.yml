name: Bump engine pin

# The reverse direction of `bump-downstream.yml`. That workflow pushes this
# repo's corpus OUT to the engines; nothing pulled the reference engine back
# IN, so `@markup-carve/carve` in package.json went stale on every carve-js
# merge and the RELEASE-mode declaration audit read the tree as not clear to
# tag. Per-PR mode reports the same staleness without gating it, so the red
# never surfaced on a pull request and the pin was bumped by hand, days late,
# whenever somebody ran the release verdict (carve#2345).
#
# Runs daily and on dispatch: resolve each engine's main, rewrite the pins in
# resources/engine-pins.json, rebuild the corpus, and open or update ONE
# automation/bump-engine-pin PR. The PR is a DRAFT when a bumped engine moves
# something here - a golden, an import axis, a suite expectation - because then
# the bump needs a decision rather than a merge. Its own CI re-validates either
# way.
#
# It covers all four engines rather than carve-js alone because CI no longer
# checks the other three out at `main`. That float is what reddened every open
# pull request here when an unrelated engine merged (carve#2869), and this
# workflow is where the move is reviewed instead.
#
# Uses the BUMP_TOKEN PAT the downstream bump already needs, so the PR is not
# subject to "Allow Actions to create PRs" and it does trigger CI.

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * *'

concurrency:
  group: bump-engine-pin
  cancel-in-progress: false

# Each job below declares timeout-minutes. A job without one inherits GitHub's
# 360-minute default, so a stalled package mirror or a fallback source build can
# hold a runner for hours before anything stops it. The slowest job measured in
# this repo takes 4 minutes, so 20 leaves plenty of room to grow.
jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history, not the default single-commit clone: the gate chain below
      # runs the suite, and tests/the-fleet-pin-check-fires.test.mjs resolves a
      # spec commit through `origin/main` and `HEAD~4`. A shallow checkout has
      # neither, so that test died on `cannot resolve a spec commit` and the
      # workflow read its own checkout depth as "the bumped engine moves
      # something here" and drafted every PR it opened (carve#2758).
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.BUMP_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Bump every engine pin to its main
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          BRANCH: automation/bump-engine-pin
        run: |
          set -euo pipefail

          # All four engines, not carve-js alone. Until carve#2869 the other
          # three were not pinned at all: CI checked them out at `main`, so an
          # engine merge reddened every open pull request here instead of
          # arriving as this PR.
          moves=""
          pending=""
          for engine in js php rb rs; do
            SHA="$(git ls-remote "https://github.com/markup-carve/carve-$engine.git" refs/heads/main | cut -f1)"
            # Via the script, which reads the pin wherever it sits. Reading it
            # inline here is what broke the first run: the pin is a
            # devDependency, the inline read asked `dependencies`, and the job
            # died on an undefined before it bumped anything.
            current="$(node scripts/set-engine-pin.mjs --current --engine "$engine")"
            if [ "$current" = "$SHA" ]; then
              echo "carve-$engine already at ${SHA:0:8}"
              continue
            fi
            echo "carve-$engine ${current:0:8} -> ${SHA:0:8}"
            moves="${moves:+$moves, }carve-$engine ${SHA:0:8}"
            pending="$pending $engine=$SHA"
          done
          if [ -z "$pending" ]; then
            echo "every engine pin is already at its main"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"

          for pair in $pending; do
            node scripts/set-engine-pin.mjs --set "${pair#*=}" --engine "${pair%%=*}"
          done
          npm install

          # What the new engine MOVES is the whole question this PR asks, so
          # rebuild the corpus from the examples and let the diff answer it.
          npm run corpus:build
          moved=""
          if ! git diff --quiet -- tests/corpus tests/spec; then
            moved="$(git diff --name-only -- tests/corpus tests/spec | wc -l) generated file(s) changed"
          fi

          # The gates that read the engine. Green means the bump is mechanical;
          # red means somebody has to decide, which is what the draft says.
          log="$(mktemp)"
          draft=""
          note="Nothing here moves with it: the suite, the corpus build and the import axes all hold."
          if ! { npm test && npm run html-import:check && npm run core:check; } > "$log" 2>&1; then
            draft="--draft"
            note="The bumped engine MOVES something here, so this is a DRAFT: read the failures, decide what the spec says, then mark it ready."
          fi
          tail -40 "$log" >> "$GITHUB_STEP_SUMMARY" || true
          if [ -n "$moved" ]; then
            note="$note Regenerated: $moved."
          fi

          git add -A
          git commit -q -m "chore: bump the engine pins to $moves"
          git push --force-with-lease origin "$BRANCH"

          body="Automated bump of the engine pins in resources/engine-pins.json to each engine main: $moves.

          Every CI job in this repository checks its engines out at these revisions, so this pull request is where an engine merge is reviewed.

          $note

          Opened by .github/workflows/bump-engine-pin.yml."

          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create --base main --head "$BRANCH" $draft \
              --title "chore: bump the engine pins to $moves" \
              --body "$body" --label chore --label area:tooling
          else
            if [ -n "$draft" ]; then
              gh pr ready "$existing" --undo 2>/dev/null || true
            else
              gh pr ready "$existing" 2>/dev/null || true
            fi
            # REST, not `gh pr edit --body`: GraphQL fails in this org on the
            # Projects-classic deprecation notice, the same reason
            # bump-downstream.yml patches bodies this way.
            gh api "repos/${GITHUB_REPOSITORY}/pulls/$existing" -X PATCH -f body="$body" >/dev/null
          fi
