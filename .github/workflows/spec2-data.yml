name: 0.2 spec data

# The data files of spec/0.2 against the ten documents, and the documents against each other. Work on next2 lands by
# push as well as by pull request, so the check runs on both.
on:
  push:
    branches: [main, next2]
    paths:
      - 'spec/0.2/**'
      - 'scripts/spec2-data-check.mjs'
      - 'scripts/spec2-trees.mjs'
      - 'scripts/spec2-unicode.mjs'
      - 'scripts/spec2-conformance.mjs'
      - 'scripts/lib/spec2-examples.mjs'
      - '.github/workflows/spec2-data.yml'
  pull_request:
    branches: [main, next2]
    paths:
      - 'spec/0.2/**'
      - 'scripts/spec2-data-check.mjs'
      - 'scripts/spec2-trees.mjs'
      - 'scripts/spec2-unicode.mjs'
      - 'scripts/spec2-conformance.mjs'
      - 'scripts/lib/spec2-examples.mjs'
      - '.github/workflows/spec2-data.yml'

permissions:
  contents: read

jobs:
  data:
    name: data files match the documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/npm-ci
        with:
          node-version: 24
      - run: npm run spec2:data
      # Fetches UnicodeData.txt of the pinned version and regenerates the category ranges.
      - run: npm run spec2:unicode
