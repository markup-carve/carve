name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '25 3 * * *'
  workflow_dispatch:

# Every job here only reads the repo; nothing publishes or comments.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global url."https://github.com/".insteadOf git@github.com:

      - name: Install
        uses: ./.github/actions/npm-ci
        with:
          node-version: 24

      - run: npm test

  docs-build:
    name: docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global url."https://github.com/".insteadOf git@github.com:

      - name: Install
        uses: ./.github/actions/npm-ci
        with:
          node-version: 24

      # Build the VitePress site so a broken doc (e.g. unescaped Vue
      # interpolation) fails the PR instead of only the Pages deploy.
      - run: npm run docs:build

  mermaid-lint:
    name: mermaid diagrams valid
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global url."https://github.com/".insteadOf git@github.com:

      - name: Install
        uses: ./.github/actions/npm-ci
        with:
          node-version: 24

      # Validate every Mermaid diagram embedded in tracked docs, including the
      # ```mermaid blocks inside .crv sources, so a broken diagram fails the PR
      # instead of silently rendering as an error in the browser. Discovery and
      # strictness are configured in mermaid-lint.config.js.
      - run: npm run lint:mermaid
