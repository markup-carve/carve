name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Every job here only reads the repo; nothing publishes or comments.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  declarations:
    name: declarations and engine pin are current
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out carve
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out carve-js
        uses: actions/checkout@v6
        with:
          repository: markup-carve/carve-js
          path: engines/carve-js
          fetch-depth: 0

      - name: Check out carve-php
        uses: actions/checkout@v6
        with:
          repository: markup-carve/carve-php
          path: engines/carve-php
          fetch-depth: 0

      - name: Check out carve-rs
        uses: actions/checkout@v6
        with:
          repository: markup-carve/carve-rs
          path: engines/carve-rs
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # PER-PR MODE, not the release verdict (carve#1811). The two answer
      # different questions and the engine-pin ledger is where they part: a
      # release cannot ship with the spec-ahead window open, but a pull request
      # is how that window OPENS. `declarations:check` - the strict mode - is
      # what the release cut runs by hand; gating a spec PR on it made every
      # ruling that leads the engines red by construction.
      #
      # What still fails here: an UNDECLARED engine-pin row, every other owed
      # ledger, the AST divergence lists, a missing guard anchor, and the
      # UNDECLARED constant sweep. Undeclared DRIFT - a slug the pin does not
      # reproduce and nobody wrote down, the carve#533 state - is gated in the
      # conformance job by `npm run engine:report -- --check`.
      - name: Every declaration is visible (per-PR verdict)
        env:
          CARVE_JS_DIR: ${{ github.workspace }}/engines/carve-js
          CARVE_PHP_DIR: ${{ github.workspace }}/engines/carve-php
          CARVE_RS_DIR: ${{ github.workspace }}/engines/carve-rs
        run: npm run declarations:pr -- --no-fetch

  conformance:
    name: spec-corpus conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # The floor tracks THIS repo's `engines` field (">=24"), which is
        # deliberately decoupled from @markup-carve/carve's ">=20".
        #
        # It used to track carve-js, on the reasoning that the oldest
        # runtime the published package promises has to be shown conformant
        # somewhere. That coupling is dropped here: carve-docs is private,
        # is never installed as a dependency, and ships data (the corpus
        # fixtures) rather than code, so its runtime is a contributor and CI
        # concern only. Meanwhile its own toolchain has moved on -- 20 is
        # long past end-of-life, 22 enters Maintenance in October 2026, and
        # @mermaid-lint/cli already requires ">=22".
        #
        # The cost is real and worth naming: conformance on Node 20 and 22
        # is no longer proven anywhere in this repo. If the ">=20" promise
        # on the published package needs backing, that belongs in carve-js's
        # own matrix, against the code that actually makes the promise.
        #
        # The ceiling is this repo's own contribution. carve-js's matrix
        # stops at 22, so 24 (Active LTS) and 26 (Current) are unverified
        # anywhere else.
        #
        # 26 gates like every other leg rather than running
        # continue-on-error: these steps are the corpus, the formal Core
        # grammar and the pinned reference build, so a red leg is a real
        # conformance signal — and a spec repo wants to hear that loudly. If
        # a future Node genuinely breaks a toolchain rather than the spec,
        # demote that leg then, with the breakage on record.
        node-version: [24, 26]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Installs ohm-js (the executable spec) and the pinned
      # `@markup-carve/carve` reference build the conformance steps render
      # through. The pin is an exact carve-js commit in package.json.
      - name: Install
        run: npm ci

      # Regenerate the corpus from resources/examples/*.md and fail if it
      # drifted from what is committed — keeps examples and fixtures
      # in lockstep.
      - name: Corpus is in sync with examples
        run: |
          npm run corpus:build
          git diff --exit-code -- tests/corpus tests/spec

      # Corpus conformance runs through the EXECUTABLE SPEC (scripts/spec), so
      # this gate does not wait for an engine to ship a rule. The pinned
      # carve-js build still backs the Tier-2, round-trip, prose-example and
      # render-option suites in the same run.
      - name: Conformance
        run: npm test

      - name: HTML import contract
        run: npm run html-import:check

      - name: Escaper corpus
        run: npm run escape:check

      - name: Executable-spec gate (formal Core grammar vs corpus)
        run: npm run core:check

      # PART 11 section 1, over documents the corpus cannot reach.
      #
      # The corpus pins documents somebody wrote, and every one of them
      # round-trips - which is why a year of corpus testing did not find any of
      # the six shapes carve#994 opened with, and why the round-trip gates that
      # do exist can only confirm that documents already known to round-trip
      # still do. scripts/property-check.mjs generates documents nobody wrote
      # and asserts the same invariant over them. Its alphabet was extended in
      # the same change to reach the constructs those six shapes are built
      # from - it reached none of them before, which the mutation below is what
      # established.
      #
      # It ran in NO job, was in no test, and was imported by no test. Not a
      # check that cannot fail - a check that is never executed (carve#755).
      #
      # Bounded and deterministic so it can gate per PR: 2000 documents from a
      # fixed seed, measured at 1.1s. The seed makes a failure reproducible and
      # comparable between builds, and the scheduled sweep uses the SAME seed at
      # a larger count, so this set is a prefix of that one.
      #
      # PROVED to fail at this count: reverting the carve-js#903 guard in the
      # pinned writer - the one space that keeps a header cell's leading `~`
      # from being read as an alignment marker - turns this step red with 99
      # undeclared violations. It is red at 2000, not only at the scheduled
      # 20000, which is what makes 2000 the count rather than a guess.
      #
      # Single-engine only here. The --engines mode needs three built
      # checkouts, which only ast-conformance.yml provisions.
      - name: PART 11 canonical-writer invariants (generated documents)
        run: npm run property:check -- --count=2000

      # The pinned reference build vs the corpus. NOT a gate on drift -- the
      # corpus is deliberately allowed to run ahead of the engine, and gating
      # on the mismatch itself would reinstate exactly the deadlock
      # scripts/engine-report.mjs exists to document.
      #
      # This gates on the drift being DECLARED. resources/engine-pin-drift.txt
      # names the slugs the pin is knowingly behind on and why; a spec PR that
      # puts the corpus ahead adds a line there and stays green. Undeclared
      # drift, and lines the pin has caught up on, both go red.
      #
      # It ran in no job at all until now, which is how carve#533 found the
      # pinned build three documents behind with nothing reporting it.
      - name: Pinned reference build matches its declared drift
        run: npm run engine:report -- --check

  docs-build:
    name: docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global url."https://github.com/".insteadOf git@github.com:

      - run: npm ci

      # Build the VitePress site so a broken doc (e.g. unescaped Vue
      # interpolation) fails the PR instead of only the Pages deploy.
      - run: npm run docs:build

  mermaid-lint:
    name: mermaid diagrams valid
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global url."https://github.com/".insteadOf git@github.com:

      - run: npm ci

      # Validate every Mermaid diagram embedded in tracked docs, including the
      # ```mermaid blocks inside .crv sources, so a broken diagram fails the PR
      # instead of silently rendering as an error in the browser. Discovery and
      # strictness are configured in mermaid-lint.config.js.
      - run: npm run lint:mermaid
