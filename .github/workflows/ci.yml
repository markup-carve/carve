name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Every job here only reads the repo; nothing publishes or comments.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  declarations:
    # Per-PR checks accept declared spec-ahead windows. The release cut uses
    # `npm run declarations:check`, which requires empty owed lists and a current pin.
    name: declarations are visible and every window is declared
    runs-on: ubuntu-latest
    # Keep the job cap above the five-minute install cap.
    timeout-minutes: 10

    steps:
      - name: Check out carve
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out carve-js
        uses: actions/checkout@v6
        with:
          repository: markup-carve/carve-js
          path: engines/carve-js
          fetch-depth: 0

      - name: Check out carve-php
        uses: actions/checkout@v6
        with:
          repository: markup-carve/carve-php
          path: engines/carve-php
          fetch-depth: 0

      - name: Check out carve-rs
        uses: actions/checkout@v6
        with:
          repository: markup-carve/carve-rs
          path: engines/carve-rs
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Use HTTPS for Git dependencies on runners without SSH credentials.
      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global url."https://github.com/".insteadOf git@github.com:

      # Bound installation separately from the declaration audit.
      - name: Install
        timeout-minutes: 5
        run: npm ci

      # Gate declaration coverage here; engine:report checks live pin drift below.
      - name: Every declaration is visible (per-PR verdict)
        env:
          CARVE_JS_DIR: ${{ github.workspace }}/engines/carve-js
          CARVE_PHP_DIR: ${{ github.workspace }}/engines/carve-php
          CARVE_RS_DIR: ${{ github.workspace }}/engines/carve-rs
        run: npm run declarations:pr -- --no-fetch

  conformance:
    name: spec-corpus conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # Match this repository's Node minimum and test the current release too.
        # Published engine runtime support belongs in each engine repository.
        # Node 26 gates normally; demote it only for recorded toolchain breakage.
        node-version: [24, 26]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Installs ohm-js (the executable spec) and the pinned
      # `@markup-carve/carve` reference build the conformance steps render
      # through. The pin is an exact carve-js commit in package.json.
      - name: Install
        run: npm ci

      # Regenerate the corpus from resources/examples/*.md and fail if it
      # drifted from what is committed — keeps examples and fixtures
      # in lockstep.
      # `git diff` compares tracked files, so a generated file a pull request
      # never added is untracked and produces no diff (carve#2037).
      - name: Corpus is in sync with examples
        run: |
          npm run corpus:build
          git diff --exit-code -- tests/corpus tests/spec
          untracked=$(git ls-files --others --exclude-standard -- tests/corpus tests/spec)
          if [ -n "$untracked" ]; then
            echo "Generated but not committed:"
            echo "$untracked"
            exit 1
          fi

      # Corpus conformance runs through the EXECUTABLE SPEC (scripts/spec), so
      # this gate does not wait for an engine to ship a rule. The pinned
      # carve-js build still backs the Tier-2, round-trip, prose-example and
      # render-option suites in the same run.
      - name: Conformance
        run: npm test

      # Audit normative pages on each PR; inputs come from this repository.
      - name: Normative pages state nothing the spec source does not
        run: npm run normative:check

      # Three committed artifacts are assembled from sources: grammar.ebnf from
      # resources/spec/*.ebnf, the rule index from the grammar, node-roles.json
      # from the AST contract. Every other gate and almost every test reads the
      # ARTIFACT, so a source-only edit is invisible to all of them - it does not
      # fail, it silently does not apply.
      - name: Grammar aggregate matches its spec sources
        run: npm run spec:check

      - name: Rule ids and the rule index match the grammar
        run: npm run spec:rules:check

      - name: node-roles.json matches the AST contract
        run: npm run roles:check

      # A production off the `document` root derives nothing, so an edit to it
      # changes no document and no test notices. quote_block sat that way from
      # the modularization refactor until carve#2670.
      - name: Every production is reachable or declared unreachable
        run: npm run grammar:productions

      # A rule COPIED instead of referenced drifts: widening one copy leaves the
      # others behind. Seven productions spelled one alternation before carve#2671.
      - name: No production copies another's right-hand side undeclared
        run: npm run grammar:duplicates

      - name: HTML import contract
        run: npm run html-import:check
        # The binding-contract half reads four repositories' trees through the
        # GitHub API. Unauthenticated from a runner that is one of 60 requests an
        # hour per address, and the check fails rather than skipping when it is
        # refused, so the token is what keeps a real red distinguishable.
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Escaper corpus
        run: npm run escape:check

      - name: Executable-spec gate (formal Core grammar vs corpus)
        run: npm run core:check

      - name: Grammar reachability (corpus vs formal Core grammar)
        run: npm run grammar:reach

      # Check writer invariants on 2,000 generated documents with a fixed seed.
      # The scheduled sweep extends the same sequence. This job uses the pinned
      # engine. ast-conformance.yml provisions checkouts for --engines mode,
      # which is currently unwired. The 2,000-case set detects the
      # table-alignment regression verified by reverting carve-js#903.
      - name: PART 11 canonical-writer invariants (generated documents)
        run: npm run property:check -- --count=2000

      # Fail on undeclared drift and on declarations the pin has caught up on.
      # Add spec-ahead fixtures to resources/engine-pin-drift.txt and remove them
      # once the pinned engine reproduces them.
      - name: Pinned reference build matches its declared drift
        run: npm run engine:report -- --check

  docs-build:
    name: docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global url."https://github.com/".insteadOf git@github.com:

      - run: npm ci

      # Build the VitePress site so a broken doc (e.g. unescaped Vue
      # interpolation) fails the PR instead of only the Pages deploy.
      - run: npm run docs:build

  mermaid-lint:
    name: mermaid diagrams valid
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global url."https://github.com/".insteadOf git@github.com:

      - run: npm ci

      # Validate every Mermaid diagram embedded in tracked docs, including the
      # ```mermaid blocks inside .crv sources, so a broken diagram fails the PR
      # instead of silently rendering as an error in the browser. Discovery and
      # strictness are configured in mermaid-lint.config.js.
      - run: npm run lint:mermaid
