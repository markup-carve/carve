name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: spec-corpus conformance
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      # Installs ohm-js (the executable spec) and the pinned
      # `@markup-carve/carve` reference build the conformance steps render
      # through. The pin is an exact carve-js commit in package.json.
      - name: Install
        run: npm ci

      # Regenerate the corpus from docs/examples.md and fail if it
      # drifted from what is committed — keeps examples and fixtures
      # in lockstep.
      - name: Corpus is in sync with examples
        run: |
          npm run corpus:build
          git diff --exit-code -- tests/corpus tests/spec

      # Run every corpus pair through the pinned carve-js build. A red run
      # means that build lags the spec (bump the pin with
      # `npm run bump-carve-pin`) or the spec changed.
      - name: Conformance
        run: npm test

      - name: Executable-spec gate (formal Core grammar vs corpus)
        run: npm run core:check

  docs-build:
    name: docs build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global url."https://github.com/".insteadOf git@github.com:

      - run: npm ci

      # Build the VitePress site so a broken doc (e.g. unescaped Vue
      # interpolation) fails the PR instead of only the Pages deploy.
      - run: npm run docs:build

  mermaid-lint:
    name: mermaid diagrams valid
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global url."https://github.com/".insteadOf git@github.com:

      - run: npm ci

      # Validate every Mermaid diagram embedded in tracked docs, including the
      # ```mermaid blocks inside .crv sources (via --ext crv), so a broken
      # diagram fails the PR instead of silently rendering as an error in the
      # browser.
      - run: npm run lint:mermaid
