name: Release lane checks
on:
  pull_request:
    paths:
      - '.github/workflows/*release*.yml'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/*release*'
      - '.github/release-lane.json'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python .github/scripts/test_release_lane.py
      - run: python .github/scripts/test_release_workflow.py
