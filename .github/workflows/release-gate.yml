name: Release Gate

# SUPERSEDED FOR A DISPATCHED RELEASE, and kept as a rehearsal. `release.yml`
# now runs this same completeness check BEFORE the tag, with the approval between
# them, so the gate that can actually hold a release back lives there.
#
# The tag trigger below no longer fires on a release either: `release.yml` creates
# the tag with `github.token`, and a ref created with that token does not trigger
# other workflows. It still fires on a tag pushed by hand, which is the one route
# `release.yml` does not cover, so it stays as the backstop for that case.
#
# Do not read a green run here as a release gate. A gate downstream of the
# irreversible act cannot withhold anything, which is what this header used to
# say about itself.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  # A rehearsal against whatever package.json currently declares, so the first
  # time this runs is not the moment a tag makes it awkward.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changelog:
    name: the changelog section accounts for every merge in this release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # The gate walks every merge back to the previous tag, so it needs the
          # tags and the history behind them.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # A `chore: cut X.Y.Z` commit writes the `## [X.Y.Z]` section and then
      # development carries on over it. Nobody reopens the section, so the tag
      # ships notes describing cut day alone - here, 0.1.6 shipped and
      # `[Unreleased]` stayed empty for the 33 merges after it. The version and
      # section guards in pre-tag-check ask whether the section EXISTS, which
      # passes on that; this asks whether it is COMPLETE. The script reports the
      # absent-section case too, and needs no install.
      - name: Every merge since the previous tag is cited
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/changelog-completeness.mjs
          else
            node scripts/changelog-completeness.mjs "${GITHUB_REF_NAME}"
          fi
