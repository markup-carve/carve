<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Carve">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#dee3e8"/>
    </linearGradient>
    <linearGradient id="markBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ba38a"/>
      <stop offset="100%" stop-color="#2d6856"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Logo (rounded square + slash), positioned upper left of text -->
  <g transform="translate(140 165)">
    <rect width="300" height="300" rx="56" fill="url(#markBg)"/>
    <path d="M 207 72 L 93 228" stroke="#ffffff" stroke-width="34" stroke-linecap="round"/>
    <path d="M 201 80 L 95 226" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Wordmark -->
  <text x="500" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="148" font-weight="800" letter-spacing="-4" fill="#1f2328">Carve</text>

  <!-- Tagline -->
  <text x="500" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="500" fill="#475158">A post-Markdown markup language</text>

  <!-- Mini-syntax mnemonic line -->
  <text x="500" y="445" font-family="ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace"
        font-size="28" fill="#2d6856">/italic/   *bold*   _underline_   ~strike~</text>
</svg>
